upstream openhouse_app {
    ip_hash;  # sticky session
    server openhouse_app_ex:80;
    server openhouse_app_ex_2:80;
    server openhouse_app_ex_3:80;
}

server {
    listen 80;
    server_name _;
    
    location /sit-certificate/ {
        alias /sit-cert/;
        autoindex off;            # ถ้าอยาก list ไฟล์ให้ on
        add_header Content-Type application/pdf;
        try_files $uri $uri/ =404;
    }
    
 # Path สำหรับ protected SIT certificate
    location /sit-protected/ {
        # ตรวจสอบ secure link: $arg_sig = MD5 hash, $arg_exp = timestamp
        secure_link $arg_sig,$arg_exp;
        secure_link_md5 "$secure_link_expires$uri sitopenhousesecret2025";

        # ถ้าไม่มี sig หรือผิด/หมดอายุ → 403
        if ($secure_link = "") { return 403; }
        if ($secure_link = 0)  { return 403; }

        # ชี้ไปยังโฟลเดอร์จริงที่เก็บ PDF
        alias /sit-cert/;   # ต้องมี / ท้าย
        add_header Content-Type application/pdf;
        # สามารถเปิด autoindex = on เพื่อ debug ดูไฟล์ก็ได้
    }

    # Webhook deployment service (proxied to kmutt-webhook on port 9000)
    location /api/v1/webhook {
        proxy_pass http://172.17.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
    }

    # Backward-compatible alias for /postreceive -> /api/v1/webhook
    location /postreceive {
        proxy_pass http://172.17.0.1:9000/api/v1/webhook;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
    }

    location /api/v1/health {
        proxy_pass http://172.17.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://openhouse_app;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # Simple Nginx metrics for Prometheus
    location /nginx_status {
        stub_status;
        allow all;
    }

    # Log for traffic estimation per container
    access_log /var/log/nginx/access.log main;
}
