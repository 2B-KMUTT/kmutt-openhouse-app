x-app-base: &app-base
  image: kmutt_oph_prod
  restart: unless-stopped
  env_file:
    - .env
  environment:
    - NEXTAUTH_URL=${NEXTAUTH_URL}
    - DATABASE_URL=${DATABASE_URL}
    - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    - EXTERNAL_JWT_SECRET=${EXTERNAL_JWT_SECRET}
    - SMTP_USER=${SMTP_USER}
    - SMTP_PASS=${SMTP_PASS}
    - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
    - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
    - NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY=${NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY}
    - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}

services:
  # Nginx Reverse Proxy / Load Balancer
  nginx:
    image: zengxs/nginx:latest
    container_name: openhouse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx_logs:/var/log/nginx
      - /root/sit-cert:/sit-cert:ro
    depends_on:
      - openhouse_app_1
      - openhouse_app_2
      - openhouse_app_3

  # Application Replicas
  openhouse_app_1:
    <<: *app-base
    container_name: openhouse_app_1
    ports:
      - "81:80"

  openhouse_app_2:
    <<: *app-base
    container_name: openhouse_app_2
    ports:
      - "82:80"

  openhouse_app_3:
    <<: *app-base
    container_name: openhouse_app_3
    ports:
      - "83:80"

  # ==========================================
  # Monitoring Stack (Profile: monitoring)
  # ไม่รันตอน docker compose up -d ทั่วไป
  # เปิดใช้งานเมื่อพร้อม: docker compose --profile monitoring up -d
  # ==========================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    profiles:
      - monitoring
    network_mode: host
    pid: "host"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "3000:3000"
