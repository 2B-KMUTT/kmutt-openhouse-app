x-app-base: &app-base
  image: ${APP_IMAGE:-ghcr.io/2b-kmutt/kmutt-openhouse-app:latest}
  restart: unless-stopped
  env_file:
    - .env

services:
  # Nginx Reverse Proxy / Load Balancer
  nginx:
    image: zengxs/nginx:latest
    container_name: openhouse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx_logs:/var/log/nginx
      - /root/sit-cert:/sit-cert:ro
    depends_on:
      - openhouse_app_1
      - openhouse_app_2
      - openhouse_app_3

  # Application Replicas (Port 81, 82, 83 expose /api/metrics directly for Prometheus scraping)
  openhouse_app_1:
    <<: *app-base
    container_name: openhouse_app_1
    ports:
      - "81:80"
    networks:
      default:
        aliases:
          - openhouse_app_ex

  openhouse_app_2:
    <<: *app-base
    container_name: openhouse_app_2
    ports:
      - "82:80"
    networks:
      default:
        aliases:
          - openhouse_app_ex_2

  openhouse_app_3:
    <<: *app-base
    container_name: openhouse_app_3
    ports:
      - "83:80"
    networks:
      default:
        aliases:
          - openhouse_app_ex_3

  # ==========================================
  # Exporters for OpenHouse-VM (10.2.15.90)
  # Scraped by Prometheus on OpenHouse-DB (10.2.15.91)
  # ==========================================

  # 1. Host Metrics Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: openhouse_vm_node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"

  # 2. Nginx Prometheus Exporter (Scrapes /nginx_status from openhouse_nginx)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: openhouse_nginx_exporter
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:80/nginx_status"
    ports:
      - "9113:9113"
