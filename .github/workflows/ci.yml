name: CI - Quality & Verification

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'infra/db/**'
      - '.gitignore'
  workflow_dispatch:

# ป้องกันคิวทับซ้อน: ยกเลิก build เก่าอัตโนมัติหากมี commit ใหม่ push เข้ามาใน PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Auth Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Run TypeScript typecheck
        run: bun run typecheck

      - name: Run Multi-Role Auth Verification
        run: bun run test:auth

      - name: Test Next.js Build
        run: bun run build
