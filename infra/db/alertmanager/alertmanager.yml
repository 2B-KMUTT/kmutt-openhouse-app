global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'host', 'service', 'severity', 'tier']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'sre-default-receiver'
  routes:
    - match:
        tier: page
      receiver: 'sre-oncall-pager'
      repeat_interval: 1h
    - match:
        tier: ticket
      receiver: 'sre-ticket-queue'
      repeat_interval: 12h

inhibit_rules:
  # When a target host is completely down, suppress sub-service alerts from that same host
  # to prevent alert fatigue (INT531 Slide 1.15)
  - source_match:
      alertname: 'TargetInstanceDown'
      severity: 'critical'
    target_match_re:
      alertname: 'ErrorBudgetBurnRateFast|ErrorBudgetBurnRateSlow|ErrorBudgetBurnRateTicket|HighLatencyP99|MySQLConnectionsHigh'
    equal: ['host']

receivers:
  - name: 'sre-default-receiver'
    webhook_configs: []

  - name: 'sre-oncall-pager'
    # Dedicated high-priority receiver for 24/7 on-call paging (PagerDuty / Emergency Webhook)
    webhook_configs: []

  - name: 'sre-ticket-queue'
    # Low-priority receiver for ticketing / business-hour channels (Jira / Slack #alerts)
    webhook_configs: []
