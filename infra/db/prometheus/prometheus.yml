global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # 1. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          host: 'OpenHouse-DB'
          service: 'prometheus'

  # 2. Host Metrics: OpenHouse-DB (Local)
  - job_name: 'node-db'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          host: 'OpenHouse-DB'
          role: 'database'

  # 3. Database Metrics: MySQL 8.4 Exporter (Local)
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          host: 'OpenHouse-DB'
          service: 'mysql'

  # 4. Host Metrics: OpenHouse-VM (Resolved via extra_hosts: openhouse-vm:${APP_VM_IP})
  - job_name: 'node-vm'
    static_configs:
      - targets: ['openhouse-vm:9100']
        labels:
          host: 'OpenHouse-VM'
          role: 'web-app'

  # 5. Reverse Proxy: Nginx Exporter
  - job_name: 'nginx'
    static_configs:
      - targets: ['openhouse-vm:9113']
        labels:
          host: 'OpenHouse-VM'
          service: 'nginx'

  # 6. Application Replicas SLI Metrics: OpenHouse App
  - job_name: 'openhouse-app'
    metrics_path: '/api/metrics'
    static_configs:
      - targets:
          - 'openhouse-vm:81'
          - 'openhouse-vm:82'
          - 'openhouse-vm:83'
        labels:
          host: 'OpenHouse-VM'
          service: 'openhouse-app'
